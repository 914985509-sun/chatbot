<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多轮对话助手</title>
  <style>
    /* ──────────────────────────────────────
       全局 & 变量
    ────────────────────────────────────── */
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #6c63ff;
      --accent-hover: #8b85ff;
      --accent-light: rgba(108, 99, 255, 0.15);
      --text: #e8eaf6;
      --text-muted: #8b90b8;
      --user-bubble: #6c63ff;
      --ai-bubble: #22263a;
      --danger: #ff5f7e;
      --success: #4cde9e;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ──────────────────────────────────────
       顶部导航栏
    ────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 状态指示灯 */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background .3s;
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }

    /* 模型选择 */
    .model-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      outline: none;
    }
    .model-select:focus { border-color: var(--accent); }

    /* 图标按钮 */
    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: color .2s, background .2s, border-color .2s;
    }
    .icon-btn:hover { color: var(--text); background: var(--border); border-color: var(--accent); }
    .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    /* API Key 配置弹窗触发按钮 */
    .settings-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color .2s, border-color .2s;
    }
    .settings-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ──────────────────────────────────────
       会话历史统计条
    ────────────────────────────────────── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .stats-bar .stat {
      display: flex; align-items: center; gap: 4px;
    }

    .stats-bar .stat span.num {
      color: var(--accent);
      font-weight: 600;
    }

    /* ──────────────────────────────────────
       主聊天区
    ────────────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* 欢迎空态 */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 0;
    }

    .welcome .big-logo {
      font-size: 56px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome h2 { font-size: 20px; color: var(--text); font-weight: 600; }
    .welcome p { font-size: 14px; max-width: 360px; line-height: 1.6; }

    .welcome .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .suggestion-chip:hover { border-color: var(--accent); background: var(--accent-light); }

    /* ──────────────────────────────────────
       消息气泡
    ────────────────────────────────────── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 800px;
      width: 100%;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai   { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
    }

    .message.ai .avatar {
      background: linear-gradient(135deg, #22263a, #2e3250);
      border: 1px solid var(--border);
      font-size: 16px;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: calc(100% - 50px);
    }

    .message.user .bubble-wrap { align-items: flex-end; }
    .message.ai  .bubble-wrap { align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble-meta {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* 代码块 */
    .bubble code {
      background: rgba(0,0,0,0.3);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }

    .bubble pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
    }

    .bubble pre code { background: none; padding: 0; }

    /* 流式打字光标 */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink .7s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ──────────────────────────────────────
       输入区
    ────────────────────────────────────── */
    footer {
      padding: 12px 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color .2s;
    }

    .input-wrap:focus-within { border-color: var(--accent); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      line-height: 1.6;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }

    textarea::placeholder { color: var(--text-muted); }
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:active:not(:disabled) { transform: scale(.93); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; opacity: .5; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 6px;
      padding: 0 4px;
    }

    /* ──────────────────────────────────────
       Modal 弹窗
    ────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn .2s ease;
    }

    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: min(480px, 90vw);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal h2 { font-size: 17px; font-weight: 600; }
    .modal p  { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    .modal label {
      font-size: 13px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    .modal input, .modal select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      outline: none;
      font-family: inherit;
    }

    .modal input:focus, .modal select:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      font-size: 14px;
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
      transition: .2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--text); }

    /* 历史面板提示 */
    .history-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(108,99,255,.3);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      header { padding: 10px 14px; }
      main   { padding: 14px; }
      footer { padding: 10px 14px 12px; }
      .bubble { font-size: 14px; }
    }
  </style>
</head>
<body>

<!-- ═══ 顶部导航栏 ═══ -->
<header>
  <div class="header-left">
    <div class="logo">🤖</div>
    <div class="header-info">
      <h1>多轮对话助手</h1>
      <p>由 <strong>qwen3.6-plus</strong> 提供支持</p>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot" id="statusDot" title="连接状态"></div>
    <button class="settings-btn" onclick="openSettings()">⚙ 配置 API Key</button>
    <button class="icon-btn danger" onclick="clearHistory()" title="清空对话">🗑</button>
  </div>
</header>

<!-- ═══ 统计条 ═══ -->
<div class="stats-bar">
  <span class="stat">💬 本轮对话：<span class="num" id="msgCount">0</span> 条</span>
  <span class="stat">📦 已发送历史：<span class="num" id="historyCount">0</span> 条</span>
  <span class="stat" id="modelTag">🧠 模型：qwen3.6-plus</span>
</div>

<!-- ═══ 主聊天区 ═══ -->
<main id="chatArea">
  <div class="welcome" id="welcome">
    <div class="big-logo">🤖</div>
    <h2>你好，我是多轮对话助手</h2>
    <p>我能记住本轮完整的对话历史，帮你进行连续、有上下文的对话。</p>
    <div class="suggestions">
      <button class="suggestion-chip" onclick="useSuggestion(this)">介绍一下你自己</button>
      <button class="suggestion-chip" onclick="useSuggestion(this)">帮我写一首关于秋天的诗</button>
      <button class="suggestion-chip" onclick="useSuggestion(this)">用简单语言解释量子纠缠</button>
      <button class="suggestion-chip" onclick="useSuggestion(this)">帮我制定一份学习计划</button>
    </div>
  </div>
</main>

<!-- ═══ 输入区 ═══ -->
<footer>
  <div class="input-wrap">
    <textarea
      id="userInput"
      placeholder="发送消息… (Enter 发送，Shift+Enter 换行)"
      rows="1"
      oninput="autoResize(this)"
      onkeydown="handleKey(event)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
      ➤
    </button>
  </div>
  <p class="input-hint">每次对话将携带完整历史上下文发送给模型 · 点击右上角配置 API Key</p>
</footer>

<!-- ═══ 设置弹窗 ═══ -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <h2>⚙ API 配置</h2>
    <p>请填写阿里云 DashScope API Key，密钥仅保存在本地浏览器，不会上传至任何服务器。</p>
    <div>
      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
    </div>
    <div>
      <label>BASE URL（可选，默认 DashScope）</label>
      <input type="text" id="baseUrlInput" value="https://dashscope.aliyuncs.com/compatible-mode/v1" />
    </div>
    <div>
      <label>模型 ID</label>
      <select id="modelSelect">
        <option value="qwen3.6-plus" selected>qwen3.6-plus（推荐）</option>
        <option value="qwen-turbo">qwen-turbo</option>
        <option value="qwen-plus">qwen-plus</option>
        <option value="qwen-max">qwen-max</option>
        <option value="qwen-long">qwen-long</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   状态管理
═══════════════════════════════════════════ */
let config = {
  apiKey: localStorage.getItem('apiKey') || '',
  baseUrl: localStorage.getItem('baseUrl') || 'https://dashscope.aliyuncs.com/compatible-mode/v1',
  model: localStorage.getItem('model') || 'qwen3.6-plus'
};

// 会话历史（多轮对话核心）：格式为 OpenAI messages 数组
let conversationHistory = [];

// 是否正在生成回复
let isGenerating = false;

/* ═══════════════════════════════════════════
   初始化
═══════════════════════════════════════════ */
window.onload = () => {
  updateStatusDot();
  updateStats();
  document.getElementById('userInput').focus();

  // 恢复保存的模型
  const modelTag = document.getElementById('modelTag');
  if (modelTag) modelTag.textContent = '🧠 模型：' + config.model;

  // 如果没有 API Key，自动弹出配置
  if (!config.apiKey) {
    setTimeout(openSettings, 400);
  }
};

/* ═══════════════════════════════════════════
   设置弹窗
═══════════════════════════════════════════ */
function openSettings() {
  document.getElementById('apiKeyInput').value = config.apiKey;
  document.getElementById('baseUrlInput').value = config.baseUrl;
  document.getElementById('modelSelect').value = config.model;
  document.getElementById('settingsModal').classList.remove('hidden');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.add('hidden');
}

function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const url = document.getElementById('baseUrlInput').value.trim();
  const model = document.getElementById('modelSelect').value;

  if (!key) { alert('API Key 不能为空'); return; }

  config.apiKey = key;
  config.baseUrl = url || 'https://dashscope.aliyuncs.com/compatible-mode/v1';
  config.model = model;

  localStorage.setItem('apiKey', key);
  localStorage.setItem('baseUrl', config.baseUrl);
  localStorage.setItem('model', model);

  document.getElementById('modelTag').textContent = '🧠 模型：' + model;
  updateStatusDot();
  closeSettings();
}

// 点击遮罩关闭
document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

/* ═══════════════════════════════════════════
   会话历史统计
═══════════════════════════════════════════ */
function updateStats() {
  document.getElementById('msgCount').textContent = conversationHistory.length;
  // 每次发送请求时携带的历史条数（包含本次用户消息）
  document.getElementById('historyCount').textContent = conversationHistory.length;
}

function updateStatusDot() {
  const dot = document.getElementById('statusDot');
  if (config.apiKey) {
    dot.classList.add('online');
    dot.title = 'API Key 已配置';
  } else {
    dot.classList.remove('online');
    dot.title = '请配置 API Key';
  }
}

/* ═══════════════════════════════════════════
   核心：发送消息
═══════════════════════════════════════════ */
async function sendMessage() {
  if (isGenerating) return;

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  if (!config.apiKey) {
    openSettings();
    return;
  }

  // 隐藏欢迎区
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  // 清空输入框
  input.value = '';
  input.style.height = '24px';
  toggleSendBtn(false);

  // 1. 把用户消息加入历史
  conversationHistory.push({ role: 'user', content: text });
  updateStats();

  // 2. 渲染用户气泡
  appendBubble('user', text);

  // 3. 创建 AI 气泡（流式）
  const aiId = 'ai-' + Date.now();
  const aiBubble = appendBubble('ai', '', aiId);

  isGenerating = true;

  try {
    // 4. 调用 API，携带完整历史
    const response = await fetch(`${config.baseUrl}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify({
        model: config.model,
        messages: conversationHistory,   // ← 完整历史
        stream: true
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: { message: response.statusText } }));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    // 5. 流式读取
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let assistantContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          assistantContent += delta;
          updateStreamBubble(aiId, assistantContent);
        } catch (_) {}
      }
    }

    // 6. 把 AI 回复加入历史（多轮对话关键！）
    conversationHistory.push({ role: 'assistant', content: assistantContent });
    updateStats();

    // 移除打字光标
    finalizeBubble(aiId);

  } catch (err) {
    updateStreamBubble(aiId, `❌ 请求出错：${err.message}\n\n请检查 API Key 和网络连接是否正常。`, true);
    finalizeBubble(aiId);
    // 回滚失败的 user 消息（可选）
    conversationHistory.pop();
    updateStats();
  }

  isGenerating = false;
  toggleSendBtn(true);
  input.focus();
}

/* ═══════════════════════════════════════════
   UI：气泡操作
═══════════════════════════════════════════ */
function appendBubble(role, content, id) {
  const chatArea = document.getElementById('chatArea');
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role}`;

  const avatarEmoji = role === 'user' ? '👤' : '🤖';

  msgDiv.innerHTML = `
    <div class="avatar">${avatarEmoji}</div>
    <div class="bubble-wrap">
      <div class="bubble" ${id ? `id="${id}"` : ''}>${escapeHtml(content)}${id ? '<span class="cursor"></span>' : ''}</div>
      <div class="bubble-meta">${time}${role === 'ai' ? ' · ' + config.model : ''}</div>
    </div>
  `;

  chatArea.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function updateStreamBubble(id, content, isError) {
  const el = document.getElementById(id);
  if (!el) return;
  // 简单 markdown：代码块处理
  el.innerHTML = renderMarkdown(content) + '<span class="cursor"></span>';
  if (isError) el.style.color = 'var(--danger)';
  scrollToBottom();
}

function finalizeBubble(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const cursor = el.querySelector('.cursor');
  if (cursor) cursor.remove();
}

function renderMarkdown(text) {
  // 简版 markdown：代码块、行内代码、换行
  return text
    .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`)
    .replace(/\n/g, '<br>');
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function scrollToBottom() {
  const chatArea = document.getElementById('chatArea');
  chatArea.scrollTop = chatArea.scrollHeight;
}

/* ═══════════════════════════════════════════
   清空对话
═══════════════════════════════════════════ */
function clearHistory() {
  if (conversationHistory.length === 0) return;
  if (!confirm('确认清空本轮所有对话？此操作不可撤销。')) return;

  conversationHistory = [];
  updateStats();

  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="big-logo">🤖</div>
      <h2>你好，我是多轮对话助手</h2>
      <p>我能记住本轮完整的对话历史，帮你进行连续、有上下文的对话。</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="useSuggestion(this)">介绍一下你自己</button>
        <button class="suggestion-chip" onclick="useSuggestion(this)">帮我写一首关于秋天的诗</button>
        <button class="suggestion-chip" onclick="useSuggestion(this)">用简单语言解释量子纠缠</button>
        <button class="suggestion-chip" onclick="useSuggestion(this)">帮我制定一份学习计划</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════
   辅助：建议 Chip
═══════════════════════════════════════════ */
function useSuggestion(btn) {
  document.getElementById('userInput').value = btn.textContent;
  sendMessage();
}

/* ═══════════════════════════════════════════
   输入框自动伸缩 & 快捷键
═══════════════════════════════════════════ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  toggleSendBtn(el.value.trim().length > 0 && !isGenerating);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function toggleSendBtn(enabled) {
  const btn = document.getElementById('sendBtn');
  btn.disabled = !enabled;
  // 简易：不禁用，允许随时发送（只阻塞 isGenerating）
  btn.disabled = isGenerating;
}
</script>
